<title>Liste di Natale</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a fir-green night with falling snow and a string of lights; each gift is a paper tag on a string,
   tapping a tag opens a ribbon-wrapped card with the summary and the booking.
   Type: Instrument Serif (italic for the title, upright for names of things) + Manrope for UI.
   Space: one 4px-based scale, generous between sections, tight inside groups. */
:root {
  --night: #0d241b;
  --fir: #163a2b;
  --berry: #c3283d;
  --berry-deep: #8f1a2b;
  --gold: #e3b553;
  --gold-soft: #f3dc9f;
  --snow: #fdfaf3;
  --mist: #c9dbd1;
  --paper: #fbf4e4;
  --paper-2: #f2e6cb;
  --ink: #2b1b17;
  --ink-soft: #6f5d50;
  --rule: rgba(43,27,23,.12);
  --wire: #0a1a13;
  --serif: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: "Manrope", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
  --r-sm: 10px; --r: 14px; --r-lg: 22px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--night); color: var(--snow); font-family: var(--sans); font-size: 15px; line-height: 1.5;
  background-image: radial-gradient(1200px 600px at 50% -10%, #23573f 0%, transparent 60%), radial-gradient(900px 500px at 100% 100%, #1a3f2f 0%, transparent 60%); background-attachment: fixed; }
[hidden] { display: none !important; }
#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding-block: 0 var(--s8);
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* string of lights */
.lights { display: flex; height: 44px; overflow: hidden; margin: 0 calc(-1 * var(--s2)); }
.seg { flex: 1; position: relative; height: 16px; border-bottom: 2px solid var(--wire); border-radius: 0 0 50% 50% / 0 0 100% 100%; }
.bulb { position: absolute; left: 50%; top: 15px; width: 11px; height: 17px; margin-left: -5.5px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
  background: var(--c); box-shadow: 0 0 10px 2px var(--c); animation: twinkle 2.6s ease-in-out infinite; animation-delay: var(--d); }
.bulb::before { content: ""; position: absolute; top: -4px; left: 2px; width: 7px; height: 5px; border-radius: 2px; background: #3a4a40; }
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .45; box-shadow: 0 0 3px 0 var(--c); } }

/* header */
header { text-align: center; padding: var(--s6) 0 0; display: grid; justify-items: center; gap: var(--s4); }
h1 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: clamp(60px, 14vw, 112px); line-height: .9; letter-spacing: -0.02em;
  margin: 0; color: var(--gold); text-shadow: 0 0 40px rgba(227,181,83,.22); }
.countdown { display: inline-flex; align-items: baseline; gap: var(--s2); padding: var(--s2) var(--s4); border: 1px solid rgba(227,181,83,.35); border-radius: 999px;
  font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-soft); }
.countdown b { font-family: var(--serif); font-size: 24px; font-weight: 400; letter-spacing: 0; line-height: 1; color: var(--snow); font-variant-numeric: tabular-nums; }
.who { font-size: 14px; color: var(--mist); display: flex; gap: var(--s2) var(--s4); justify-content: center; flex-wrap: wrap; }
.who:empty { display: none; }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--gold-soft); cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }

/* tabs */
.tabs { display: flex; gap: var(--s2); flex-wrap: wrap; justify-content: center; margin: var(--s7) 0 var(--s7); }
.tabs:empty { margin: var(--s6) 0; }
.tab { border: 1px solid rgba(227,181,83,.4); background: rgba(13,36,27,.55); color: var(--snow); border-radius: 999px;
  padding: 10px 18px; font: 700 14px var(--sans); letter-spacing: .01em; cursor: pointer; display: inline-flex; gap: var(--s2); align-items: center; }
.tab .n { font-size: 12px; font-weight: 600; color: var(--gold-soft); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--berry); border-color: var(--gold); box-shadow: 0 8px 22px rgba(195,40,61,.35); }
.tab[aria-selected="true"] .n { color: var(--snow); opacity: .85; }
.tab.add { border-style: dashed; color: var(--gold-soft); }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* section head */
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: var(--s4) var(--s5);
  padding-bottom: var(--s5); margin-bottom: var(--s6); border-bottom: 1px solid rgba(227,181,83,.22); }
.panel-head > div:first-child { display: grid; gap: var(--s2); }
.panel-head h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 7vw, 48px); line-height: 1; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.panel-head .sub { color: var(--gold-soft); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.panel-head .sub:empty { display: none; }
.tools { display: flex; gap: var(--s3); flex-wrap: wrap; align-items: center; }

/* buttons */
.btn { border: 1px solid transparent; border-radius: var(--r); padding: 11px 18px; font: 700 14px var(--sans); letter-spacing: .01em; cursor: pointer; background: transparent; color: inherit;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); text-decoration: none; white-space: nowrap; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.red { background: var(--berry); color: var(--snow); border-color: var(--berry); box-shadow: 0 3px 0 var(--berry-deep); }
.btn.red:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--berry-deep); }
.btn.line { color: var(--snow); border-color: rgba(253,250,243,.35); }
.btn.line:hover { border-color: var(--gold); }
.card .btn.line { color: var(--ink); border-color: var(--rule); }
.btn.unbook { color: var(--berry) !important; border-color: rgba(195,40,61,.4) !important; }
.btn.quiet { color: var(--ink-soft); padding: var(--s2) var(--s3); }
.btn.quiet:hover { color: var(--ink); }
.btn.danger { color: var(--berry); }
.btn.big { width: 100%; padding: 15px 20px; font-size: 15px; }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: var(--r-sm); }
.toggle { display: inline-flex; gap: var(--s2); align-items: center; font-size: 14px; font-weight: 500; color: var(--mist); cursor: pointer; margin-right: var(--s2); }
.toggle input { accent-color: var(--berry); width: 16px; height: 16px; margin: 0; }

/* gift tags */
.tags { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--s6) var(--s5); padding-left: var(--s3); }
.tag-wrap { position: relative; filter: drop-shadow(0 12px 18px rgba(0,0,0,.3)); min-width: 0; }
.tag-wrap::before { content: ""; position: absolute; left: 2px; top: 50%; width: 24px; height: 1.5px; background: var(--gold); transform: translate(-60%, -16px) rotate(-32deg); z-index: 2; }
.tag { position: relative; width: 100%; height: 100%; text-align: left; border: 0; cursor: pointer; font: inherit; color: var(--ink);
  background: linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%); border-radius: 0 var(--r-lg) var(--r-lg) 0;
  padding: var(--s5) var(--s5) var(--s5) 52px; clip-path: polygon(26px 0, 100% 0, 100% 100%, 26px 100%, 0 calc(50% + 26px), 0 calc(50% - 26px));
  display: flex; flex-direction: column; gap: var(--s3); transition: transform .25s ease; }
.tag::before { content: ""; position: absolute; left: 14px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%;
  background: var(--night); box-shadow: inset 0 0 0 2px var(--gold); }
.tag::after { content: ""; position: absolute; right: 0; top: 0; width: 40px; height: 40px; background: linear-gradient(225deg, var(--berry) 0 50%, transparent 50%); border-top-right-radius: var(--r-lg); }
@media (hover: hover) and (prefers-reduced-motion: no-preference) { .tag:hover { transform: rotate(-1deg) translateY(-3px); } }
.tag h3 { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.08; letter-spacing: -0.005em; margin: 0; padding-right: var(--s5); overflow-wrap: anywhere; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgba(22,58,43,.08); color: #1e4a37; }
.chip.price { background: rgba(195,40,61,.09); color: var(--berry-deep); font-weight: 700; font-variant-numeric: tabular-nums; }
.tag .shop { margin-top: auto; padding-top: var(--s3); border-top: 1px dashed var(--rule); font-size: 13px; color: var(--ink-soft);
  display: flex; justify-content: space-between; gap: var(--s3); align-items: center; min-width: 0; }
.tag .shop span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag .cta { font-weight: 700; color: var(--berry); white-space: nowrap; }
.tag.booked { background: linear-gradient(160deg, #ebe4d2 0%, #dbd0b6 100%); }
.tag.booked h3, .tag.booked .chips { opacity: .5; }
.tag.booked .shop { visibility: hidden; }
.stamp { position: absolute; right: var(--s5); bottom: var(--s4); transform: rotate(-7deg); border: 2px solid var(--berry); color: var(--berry); border-radius: var(--r-sm);
  padding: 4px 12px; font: 800 11px var(--sans); letter-spacing: .14em; text-transform: uppercase; background: rgba(251,244,228,.8); max-width: 75%; text-align: center; }
.stamp small { display: block; margin-top: 1px; font-size: 13px; font-weight: 700; letter-spacing: 0; text-transform: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.from { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--berry); }

/* the card */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(5,14,10,.74); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { position: relative; width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--paper); color: var(--ink); border-radius: var(--r-lg); box-shadow: 0 30px 70px rgba(0,0,0,.5); }
@media (prefers-reduced-motion: no-preference) { .card.anim { animation: pop .3s cubic-bezier(.2,1.25,.5,1); } @keyframes pop { from { transform: scale(.94) translateY(12px); opacity: 0; } } }
.card-top { position: relative; background: var(--berry); color: var(--snow); padding: var(--s6) var(--s6) var(--s5); overflow: hidden; display: grid; gap: var(--s2); }
.card-top::before { content: ""; position: absolute; top: 0; bottom: 0; right: 72px; width: 14px; background: var(--gold); }
.card-top .bow { position: absolute; right: 52px; top: -4px; font-size: 40px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
.card-top .for { position: relative; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--gold-soft); }
.card-top h3 { position: relative; font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.02; margin: 0 100px 0 0; overflow-wrap: anywhere; text-wrap: balance; }
.close { position: absolute; right: var(--s3); top: var(--s3); z-index: 2; width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer;
  background: rgba(0,0,0,.28); color: var(--snow); font-size: 20px; line-height: 1; }
.card-body { padding: var(--s5) var(--s6) var(--s6); display: grid; gap: var(--s5); }
dl.facts { display: grid; margin: 0; }
dl.facts > div { display: grid; grid-template-columns: 104px 1fr; align-items: baseline; gap: var(--s4); padding: var(--s3) 0; border-bottom: 1px solid var(--rule); }
dl.facts > div:first-child { padding-top: 0; }
dl.facts > div:last-child { border-bottom: 0; padding-bottom: 0; }
dl.facts dt { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
dl.facts dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; white-space: pre-wrap; min-width: 0; }
dl.facts dd.price { font-family: var(--serif); font-size: 28px; font-weight: 400; line-height: 1; color: var(--berry-deep); font-variant-numeric: tabular-nums; }
.shopbtn { background: var(--fir); color: var(--snow); box-shadow: 0 3px 0 #0b2219; }
.booking { border-top: 1px dashed rgba(43,27,23,.25); padding-top: var(--s5); display: grid; gap: var(--s4); }
.booking.plain { border: 0; padding: 0; }
.booking h4 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.1; }
.booking .hint { margin: 0; }
.booked-box { background: rgba(195,40,61,.07); border: 1px solid rgba(195,40,61,.28); border-radius: var(--r); padding: var(--s4) var(--s4); display: grid; gap: var(--s1); }
.booked-box .hint { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.booked-box b { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.1; overflow-wrap: anywhere; }
.card-foot { display: flex; flex-wrap: wrap; gap: var(--s1); justify-content: flex-end; border-top: 1px solid var(--rule); padding: var(--s3) var(--s5); }
label.f { display: grid; gap: var(--s2); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); min-width: 0; }
input[type=text], input[type=url], textarea { width: 100%; border: 1px solid rgba(43,27,23,.2); background: #fffdf8; color: var(--ink);
  border-radius: var(--r-sm); padding: 12px 14px; font: 500 16px var(--sans); letter-spacing: 0; text-transform: none; }
input:focus, textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(227,181,83,.3); outline: none; }
textarea { min-height: 160px; resize: vertical; font-size: 15px; line-height: 1.5; }
.form { display: grid; gap: var(--s4) var(--s3); grid-template-columns: 1fr 1fr; }
.form .full { grid-column: 1 / -1; }
.form > .btn { margin-top: var(--s2); }
@media (max-width: 460px) { .form { grid-template-columns: 1fr; } .card-top, .card-body { padding-left: var(--s5); padding-right: var(--s5); } }
.row { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.hint { font-size: 13px; line-height: 1.55; color: var(--ink-soft); }
.preview { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s2); font-size: 13px; }
.preview:empty { display: none; }
.preview li { display: flex; gap: var(--s3); min-width: 0; justify-content: space-between; padding-bottom: var(--s2); border-bottom: 1px solid var(--rule); }
.preview li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.preview li span:last-child { color: var(--ink-soft); white-space: nowrap; }
.share { display: flex; gap: var(--s2); flex-wrap: wrap; }
.share input { flex: 1; min-width: 180px; font-size: 13px; }

/* states */
.empty { text-align: center; padding: var(--s8) var(--s5); border: 1px dashed rgba(227,181,83,.4); border-radius: var(--r-lg); background: rgba(13,36,27,.55); display: grid; justify-items: center; gap: var(--s3); }
.empty .big { font-size: 44px; line-height: 1; margin-bottom: var(--s2); }
.empty h3 { font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 0; }
.empty p { color: var(--mist); margin: 0 0 var(--s3); max-width: 44ch; }
.empty .row { justify-content: center; }
.notice { font-size: 14px; padding: var(--s4); border-radius: var(--r); background: rgba(227,181,83,.14); color: var(--gold-soft); margin-bottom: var(--s5); }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s3); margin-bottom: var(--s6); }
.summary div { background: rgba(13,36,27,.6); border: 1px solid rgba(227,181,83,.28); border-radius: var(--r); padding: var(--s4) var(--s5);
  font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-soft); display: grid; gap: var(--s1); }
.summary b { font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1; letter-spacing: 0; color: var(--snow); font-variant-numeric: tabular-nums; }
.bought { display: inline-flex; gap: var(--s2); align-items: center; font-weight: 600; cursor: pointer; }
.bought input { accent-color: var(--berry); width: 18px; height: 18px; margin: 0; }
.footer-tools { display: flex; justify-content: center; gap: var(--s2); margin-top: var(--s8); padding-top: var(--s5); border-top: 1px solid rgba(227,181,83,.15); flex-wrap: wrap; }
.footer-tools .btn { color: var(--mist); font-weight: 600; }
.footer-tools .btn.red { color: var(--snow); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--s5) + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--gold); color: var(--ink); padding: var(--s3) var(--s5); border-radius: 999px; font-weight: 700; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.4); }
@media (max-width: 520px) { .tags { gap: var(--s5); } .panel-head { margin-bottom: var(--s5); } .tools { width: 100%; } .tools .toggle { width: 100%; } .tools .btn { flex: 1; } }
@media (prefers-reduced-motion: reduce) { .bulb { animation: none; } }
</style>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="lights" id="lights" aria-hidden="true"></div>
  <header>
    <h1>Liste di Natale</h1>
    <div class="countdown" id="countdown"></div>
    <div class="who" id="who"></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="main">
    <div class="empty"><div class="big">🎄</div><h3>Sto aprendo le liste…</h3><p>Qui compaiono le liste dei regali di ogni persona.</p></div>
  </main>
</div>
<div id="overlay"></div>

<script>
(() => {
  // ---------- tiny DOM helper (user text always goes in as text, never as markup) ----------
  const $ = (s) => document.querySelector(s);
  function put(el, kids, append) {
    const list = [kids].flat(8).filter((k) => k != null && k !== false).map((k) => k instanceof Node ? k : document.createTextNode(String(k)));
    append ? el.append(...list) : el.replaceChildren(...list);
    return el;
  }
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "class") el.className = v;
      else if (k === "value") el.value = v;
      else if (k === "checked") el.checked = !!v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    return put(el, kids, true);
  }
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  const S = {
    mode: null, db: null, family: "", needsFamily: false,
    ready: false, error: null, slow: false, readOnly: false,
    lists: [], items: [],
    active: store.get("tab", ""),
    me: store.get("me", ""),
    hideBooked: store.get("hideBooked", "0") === "1",
    confirm: null,
    open: null,
  };

  // ---------- helpers ----------
  const norm = (s) => (s || "").trim().toLowerCase();
  const isMe = (name) => !!S.me && norm(name) === norm(S.me);
  const safeUrl = (u) => { try { const x = new URL(String(u).trim()); return x.protocol === "https:" || x.protocol === "http:" ? x.href : null; } catch { return null; } };
  const domain = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
  const parsePrice = (s) => { const t = String(s ?? "").replace(/[^\d,.]/g, ""); if (!t) return null; const n = parseFloat(t.replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".")); return isFinite(n) ? Math.round(n * 100) / 100 : null; };
  const eur = (n) => n == null ? "" : Number(n).toLocaleString("it-IT", { style: "currency", currency: "EUR" });
  const listOf = (id) => S.lists.find((l) => l.id === id);
  const itemOf = (id) => S.items.find((i) => i.id === id);
  const itemsOf = (id) => S.items.filter((i) => i.listId === id);
  const ownList = (list) => !!list && isMe(list.name);
  const rememberMe = (name) => { S.me = name.trim(); store.set("me", S.me); };

  function toast(msg) {
    document.querySelectorAll(".toast").forEach((t) => t.remove());
    const t = h("div", { class: "toast", role: "status" }, msg);
    document.body.append(t);
    setTimeout(() => t.remove(), 2400);
  }
  async function write(fn, okMsg) {
    try { await fn(); if (okMsg) toast(okMsg); return true; }
    catch (e) {
      const c = e && e.code;
      if (c === "permission-denied" || c === "invalid_argument" || c === "invalid-argument") { S.readOnly = true; toast("Non è possibile modificare le liste."); render(); }
      else if (c === "quota_exceeded" || c === "resource-exhausted") toast("Limite raggiunto: riprova più tardi.");
      else toast("Non sono riuscito a salvare. Riprova tra un attimo.");
      return false;
    }
  }

  // ---------- paste parser: one gift per line ----------
  const URL_RE = /https?:\/\/[^\s<>"']+/i;
  function titleFromUrl(u) {
    try {
      const segs = new URL(u).pathname.split("/").filter(Boolean)
        .filter((s) => !/^\d+$/.test(s) && !/^(p|dp|product|prodotto|it|en|item|html?)$/i.test(s));
      const best = segs.sort((a, b) => b.length - a.length)[0] || "";
      const t = decodeURIComponent(best).replace(/\.(html?|php|aspx?)$/i, "").replace(/[-_+]+/g, " ").replace(/\b(?=[a-z]*\d)[a-z0-9]{5,}\b/gi, "").replace(/\s{2,}/g, " ").trim();
      return t ? t.charAt(0).toUpperCase() + t.slice(1) : domain(u);
    } catch { return u; }
  }
  function pull(text, re) { const m = text.match(re); return m ? [(m[1] || m[2] || "").trim(), text.replace(m[0], " ")] : ["", text]; }
  const tidy = (s) => (s || "").replace(/\s*[,;]\s*(?=[,;]|$)/g, "").replace(/^[\s,;:–—\-|]+|[\s,;:–—\-|]+$/g, "").replace(/\s{2,}/g, " ").trim();
  const SIZE_RE = /\btaglia\s*:?\s*((?:X{0,3}[SL]|M|XXL|XXXL|unica|\d{1,3}(?:[.,]5)?)(?:\s?\/\s?(?:X{0,3}[SL]|M|\d{1,3}))?)(?![\wà-ÿ'’])/i;
  const COLOR_RE = /\bcolou?re\s*:?\s*([a-zà-ÿ][a-zà-ÿ ]*?)(?=\s*[,;]|\s*$)/i;
  const PRICE_RE = /€\s?(\d+(?:[.,]\d{1,2})?)|(\d+(?:[.,]\d{1,2})?)\s?(?:€|euro\b|eur\b)/i;
  // WhatsApp copy: "[23/11, 21:08] Mamy: …" or "23/11/25, 21:08 - Mamy: …"
  const CHAT_PREFIX = /^\[?\d{1,2}\/\d{1,2}(?:\/\d{2,4})?,?\s+\d{1,2}[:.]\d{2}(?::\d{2})?\]?\s*(?:-\s*)?[^:\n]{1,40}?:\s*/;
  const NOISE = /^(ciao[!.]*|acquista su amazon[:.]?|guarda (questo|qui)[:.]?|ecco[:.]?)$/i;
  const ASK_LINK = /^domande sui prodotti\?/i; // the URL that follows is the Q&A page, not the product
  const SHORT_SHOP = { "amzn.eu": "Amazon", "amzn.to": "Amazon", "a.co": "Amazon", "amazon.it": "Amazon", "share.google": "", "bit.ly": "" };
  const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  function titleForUrl(url) {
    if (/amazon\.[a-z.]+\/hz\/wishlist|amazon\.[a-z.]+\/.*wishlist/i.test(url)) return "Lista desideri su Amazon";
    const shop = SHORT_SHOP[domain(url)];
    if (shop) return "Regalo su " + shop;
    if (shop === "") return "Regalo (apri il link)";
    return titleFromUrl(url);
  }
  function parsePaste(text) {
    const out = [];
    let skipNextUrl = false;
    for (let raw of text.split(/\r?\n/)) {
      raw = raw.replace(CHAT_PREFIX, "").trim();
      if (!raw || NOISE.test(raw)) continue;
      if (ASK_LINK.test(raw)) { skipNextUrl = !URL_RE.test(raw); continue; }
      const m = raw.match(URL_RE);
      const url = m ? m[0].replace(/[).,;]+$/, "") : "";
      if (url && skipNextUrl) { skipNextUrl = false; if (!tidy(raw.replace(m[0], ""))) continue; }
      skipNextUrl = false;
      let rest = (m ? raw.replace(m[0], " ") : raw).replace(/^[\s•*·\-–—]+|^\d+[.)]\s+/, "");
      if (!url && /:\s*$/.test(rest)) continue; // "Poi, sempre graditi:" is a heading, not a gift
      if (url && /amazon\.[a-z.]+\/.*wishlist/i.test(url)) rest = "";
      const prev = out[out.length - 1];
      if (url && !tidy(rest) && prev && !prev.link) { prev.link = url; if (/^Regalo /.test(prev.title)) prev.title = titleForUrl(url); continue; }
      let note = "";
      const par = rest.match(/[\(\[]([^\)\]]+)(?:[\)\]]|$)/);
      if (par) { note = par[1]; rest = rest.replace(par[0], " "); }
      let size, color, price;
      [price, rest] = pull(rest, PRICE_RE); if (!price) [price, note] = pull(note, PRICE_RE);
      [size, rest] = pull(rest, SIZE_RE); if (!size) [size, note] = pull(note, SIZE_RE);
      [color, rest] = pull(rest, COLOR_RE); if (!color) [color, note] = pull(note, COLOR_RE);
      // "Taglia M colore nero" on its own line completes the gift above
      if (!url && !tidy(rest) && !tidy(note) && (size || color || price) && prev) {
        if (size && !prev.size) prev.size = size;
        if (color && !prev.color) prev.color = cap(tidy(color));
        if (price && prev.price == null) prev.price = parsePrice(price);
        continue;
      }
      // "Borsa a mano - Zalando.it": keep the shop as a detail, not in the name
      const shopTail = rest.match(/\s[-–|]\s*([A-Za-z0-9 .]+\.(?:it|com|eu|de|fr|es))\s*$/i);
      if (shopTail) { rest = rest.replace(shopTail[0], " "); note = tidy([note, "Su " + shopTail[1]].filter(Boolean).join(", ")); }
      const title = cap(tidy(rest)) || (url ? titleForUrl(url) : "");
      out.push({ title, link: url, size, color: cap(tidy(color)), note: tidy(note), price: price ? parsePrice(price) : null });
    }
    return out.filter((x) => x.title || x.link);
  }

  // ---------- connection: Firebase (GitHub Pages) or the claude.ai artifact store ----------
  const ID_RE = /^[a-z0-9]{16,40}$/;
  const familyFromHash = () => { const v = decodeURIComponent(location.hash.slice(1)).trim(); return ID_RE.test(v) ? v : ""; };
  function newFamilyId() {
    const a = new Uint8Array(20); crypto.getRandomValues(a);
    return Array.from(a, (b) => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
  }
  // One fixed family space (config.js) means one plain link for everyone.
  const fixedFamily = () => { const f = window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.family; return ID_RE.test(f || "") ? f : ""; };
  const shareLink = () => location.origin + location.pathname + (fixedFamily() ? "" : "#" + S.family);

  async function boot() {
    const cfg = window.FIREBASE_CONFIG;
    if (cfg && cfg.projectId && window.firebase) {
      S.mode = "firebase";
      S.family = fixedFamily() || familyFromHash() || store.get("family", "");
      if (!ID_RE.test(S.family)) { S.family = ""; S.needsFamily = true; render(); return; }
      if (fixedFamily()) { if (location.hash) history.replaceState(null, "", location.pathname + location.search); }
      else { store.set("family", S.family); if (location.hash.slice(1) !== S.family) history.replaceState(null, "", "#" + S.family); }
      S.needsFamily = false;
      if (!firebase.apps.length) firebase.initializeApp(cfg);
      const fs = firebase.firestore();
      const base = "families/" + S.family + "/";
      S.db = { collection: (p) => fs.collection(base + p), doc: (p) => fs.doc(base + p) };
    } else if (window.claude && typeof window.claude.use === "function") {
      let db = null;
      try { db = await window.claude.use("db"); } catch {}
      if (!db) { S.error = "Per vedere le liste apri questa pagina dal link che ti hanno mandato."; render(); return; }
      S.mode = "claude"; S.db = db;
    } else {
      S.error = "L'app non è ancora collegata al database. Segui i passi del file LEGGIMI.md (configurazione di Firebase).";
      render(); return;
    }
    const timer = setTimeout(() => { if (!S.ready) { S.slow = true; render(); } }, 10000);
    let gotLists = false, gotItems = false;
    const done = () => { if (gotLists && gotItems) { S.ready = true; S.slow = false; clearTimeout(timer); } render(); };
    const onErr = () => { clearTimeout(timer); S.error = "Non riesco a leggere le liste. Controlla che il link sia completo e riprova."; render(); };
    const listen = (q, fn) => S.mode === "firebase" ? q.onSnapshot({ includeMetadataChanges: true }, fn, onErr) : q.onSnapshot(fn, onErr);
    listen(S.db.collection("lists").orderBy("order"), (snap) => {
      S.lists = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) gotLists = true; done();
    });
    listen(S.db.collection("items").orderBy("createdAt"), (snap) => {
      S.items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) gotItems = true; done();
    });
  }
  window.addEventListener("hashchange", () => {
    if (S.mode === "claude" || fixedFamily()) return;
    const f = familyFromHash(); if (f && f !== S.family) { store.set("family", f); location.reload(); }
  });

  // ---------- writes ----------
  function addList(name) {
    name = name.trim(); if (!name) return;
    const order = S.lists.reduce((m, l) => Math.max(m, l.order || 0), 0) + 1;
    const ref = S.db.collection("lists").doc();
    S.active = ref.id; store.set("tab", ref.id);
    closeModal();
    write(() => ref.set({ name, order, createdAt: Date.now() }), `Lista di ${name} creata`);
  }
  function addItems(listId, arr) {
    let t = Date.now();
    return write(async () => {
      for (const it of arr) {
        await S.db.collection("items").doc().set({
          listId, title: it.title.trim(), link: safeUrl(it.link) || "", price: it.price ?? null,
          size: (it.size || "").trim(), color: (it.color || "").trim(), note: (it.note || "").trim(),
          createdAt: t++, claimedBy: "", bought: false
        });
      }
    }, arr.length === 1 ? "Regalo aggiunto 🎁" : `${arr.length} regali aggiunti 🎁`);
  }
  async function book(id, name) {
    name = name.trim(); if (!name) return false;
    const ref = S.db.doc("items/" + id);
    try {
      const snap = await ref.get();
      const cur = snap.exists ? snap.data() : null;
      if (!cur) { toast("Questo regalo non c'è più."); closeModal(); return false; }
      if (cur.claimedBy && norm(cur.claimedBy) !== norm(name)) { toast(`L'ha appena prenotato ${cur.claimedBy}`); return false; }
    } catch {}
    rememberMe(name);
    return write(() => ref.update({ claimedBy: name, claimedAt: Date.now(), bought: false }), "Prenotato! 🎅");
  }
  const unbook = (id) => write(() => S.db.doc("items/" + id).update({ claimedBy: "", bought: false }), "Prenotazione annullata");

  // ---------- cards (modals) ----------
  function closeModal() { S.open = null; S.confirm = null; $("#overlay").replaceChildren(); document.body.style.overflow = ""; }
  function showModal(card, animate) {

  // the gift card: summary + booking
  let shownKey = "";
  const itemKey = (it) => [it.title, it.link, it.price, it.size, it.color, it.note, it.claimedBy, it.bought, S.confirm, S.me, S.readOnly].join("|");
  function openItem(id) { S.open = { kind: "item", id }; S.confirm = null; shownKey = ""; refreshModal(true, true); }
  function itemCard(it) {
    const list = listOf(it.listId);

      facts.length ? h("dl", { class: "facts" }, facts) : h("p", { class: "hint", style: "margin:0" }, "Nessun dettaglio aggiunto."),
      url ? h("a", { class: "btn shopbtn big", href: url, target: "_blank", rel: "noopener noreferrer" }, "Apri il link del negozio ↗") : null,
    ];

      body.push(h("div", { class: "booking" }, h("p", { class: "hint" }, "È la tua lista: chi ha prenotato cosa resta una sorpresa. 🤫")));
    } else if (!it.claimedBy) {
      if (!S.readOnly) {
        const input = h("input", { type: "text", id: "book-name", value: S.me, placeholder: "Es. Zia Carla", autocomplete: "given-name", maxlength: "40" });

          h("p", { class: "hint" }, "Tutti vedranno che è già preso. Puoi sempre annullare.")));

    } else {

      body.push(h("div", { class: "booking" },
        h("div", { class: "booked-box" }, h("span", { class: "hint" }, "Prenotato da"), h("b", {}, mine ? `${it.claimedBy} (tu)` : it.claimedBy)),
        mine && !S.readOnly ? h("label", { class: "bought" }, h("input", { type: "checkbox", id: "bought", checked: it.bought, onchange: (e) => write(() => S.db.doc("items/" + it.id).update({ bought: e.target.checked }), e.target.checked ? "Segnato come comprato" : null) }), "L'ho già comprato") : null,
        S.readOnly ? null : h("div", { class: "row" }, confirmBtn("unbook", "Annulla prenotazione", mine ? "Sì, annulla" : `Sì, togli ${it.claimedBy}`, async () => { await unbook(it.id); refreshModal(true); }, "btn line sm unbook"))));

  function openForm(listId, item) {

  function openPaste(list) {

    const input = h("input", { type: "text", id: "share-link", value: shareLink(), readonly: true, onfocus: (e) => e.target.select() });
    showModal(cardShell("", "Link per la famiglia",
      [h("p", { class: "hint", style: "margin:0" }, "Mandalo su WhatsApp a chi vuoi: lo apre e vede subito le liste, senza account e senza password. Chi ha il link può modificare le liste, quindi tienilo in famiglia."),
       h("div", { class: "share" }, input, h("button", { class: "btn red", type: "button", onclick: () => copy(shareLink(), input) }, "Copia"))]), true);
  }

  // ---------- page ----------
  function renderLights() {
    const el = $("#lights"); const n = Math.max(6, Math.round(Math.min(window.innerWidth, 920) / 64));
    if (el.childElementCount === n) return;
    const colors = ["#ff4d5e", "#ffd166", "#5fd38d", "#6cc4ff", "#ff9ad5"];
    put(el, Array.from({ length: n }, (_, i) => h("span", { class: "seg" }, h("span", { class: "bulb", style: `--c:${colors[i % colors.length]};--d:${((i * 0.37) % 2.6).toFixed(2)}s` }))));
  }
  function renderCountdown() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let xmas = new Date(now.getFullYear(), 11, 25);
    if (today > xmas) xmas = new Date(now.getFullYear() + 1, 11, 25);
    const days = Math.round((xmas - today) / 864e5);
    put($("#countdown"), days === 0 ? h("b", {}, "Buon Natale! 🎄") : [h("b", {}, days), days === 1 ? "giorno a Natale" : "giorni a Natale"]);
  }
  function renderWho() {
    put($("#who"), [
      S.me ? h("span", {}, "Ciao ", h("b", {}, S.me), " · ", h("button", { class: "linkbtn", onclick: openName }, "cambia nome")) : null,
      S.mode === "firebase" && S.family ? h("button", { class: "linkbtn", onclick: openShare }, "🔗 Link per la famiglia") : null
    ]);
  }
  function renderTabs() {
    const pick = (id) => { S.active = id; S.confirm = null; store.set("tab", id); render(); };
    const mineCount = S.items.filter((i) => i.claimedBy && isMe(i.claimedBy) && !ownList(listOf(i.listId))).length;
    put($("#tabs"), [
      S.lists.map((l) => {
        const its = itemsOf(l.id), free = its.filter((i) => !i.claimedBy).length;
        return h("button", { class: "tab", role: "tab", "aria-selected": String(S.active === l.id), onclick: () => pick(l.id) },
          l.name, h("span", { class: "n" }, ownList(l) ? its.length : `${free}/${its.length}`));
      }),
      h("button", { class: "tab", role: "tab", "aria-selected": String(S.active === "mine"), onclick: () => pick("mine") }, "🎅 I miei regali", h("span", { class: "n" }, mineCount)),
      S.readOnly ? null : h("button", { class: "tab add", onclick: openNewList }, "+ Lista")
    ]);
  }

  function tagEl(it, showList) {
    const list = listOf(it.listId);
    const own = ownList(list);
    const booked = !!it.claimedBy && !own;
    const mine = booked && isMe(it.claimedBy);
    const url = safeUrl(it.link);
    const chips = [
      it.price != null ? h("span", { class: "chip price" }, eur(it.price)) : null,
      it.size ? h("span", { class: "chip" }, "Taglia " + it.size) : null,
      it.color ? h("span", { class: "chip" }, it.color) : null,
    ].filter(Boolean);
    return h("div", { class: "tag-wrap" },
      h("button", { class: "tag" + (booked ? " booked" : ""), onclick: () => openItem(it.id), "aria-label": `${it.title}${booked ? ", prenotato da " + it.claimedBy : ""}` },
        showList && list ? h("span", { class: "from" }, "Per " + list.name) : null,
        h("h3", {}, it.title),
        chips.length ? h("div", { class: "chips" }, chips) : null,
        h("div", { class: "shop" }, h("span", {}, url ? domain(url) : (it.note || "")), h("span", { class: "cta" }, own || S.readOnly ? "Dettagli" : "Prenota →")),
        booked ? h("span", { class: "stamp" }, mine ? "Lo prendi tu" : "Prenotato", mine ? null : h("small", {}, it.claimedBy)) : null));
  }

  function renderList(list) {
    const all = itemsOf(list.id);
    const own = ownList(list);
    const free = all.filter((i) => !i.claimedBy).length;
    const shown = S.hideBooked && !own ? all.filter((i) => !i.claimedBy) : all;
    const parts = [
      h("div", { class: "panel-head" },
        h("div", {}, h("h2", {}, "La lista di " + list.name),
          h("div", { class: "sub" }, own ? "È la tua lista: le prenotazioni restano una sorpresa." : all.length ? `${free} da prenotare · ${all.length - free} già prenotati` : "")),
        h("div", { class: "tools" },
          own || !all.length ? null : h("label", { class: "toggle" }, h("input", { type: "checkbox", id: "hide-booked", checked: S.hideBooked, onchange: (e) => { S.hideBooked = e.target.checked; store.set("hideBooked", e.target.checked ? "1" : "0"); render(); } }), "Nascondi prenotati"),
          S.readOnly || !all.length ? null : h("button", { class: "btn line", onclick: () => openPaste(list) }, "Incolla lista"),
          S.readOnly || !all.length ? null : h("button", { class: "btn red", onclick: () => openForm(list.id) }, "+ Regalo")))
    ];
    if (shown.length) parts.push(h("div", { class: "tags" }, shown.map((i) => tagEl(i))));
    else parts.push(h("div", { class: "empty" }, h("div", { class: "big" }, all.length ? "🎉" : "🎁"),
      h("h3", {}, all.length ? "Tutto prenotato!" : "La lista è ancora vuota"),
      h("p", {}, all.length ? "Ogni regalo di questa lista ha già chi lo prende." : `Aggiungi i regali uno alla volta, oppure incolla in un colpo solo il messaggio di ${list.name}.`),
      all.length || S.readOnly ? null : h("div", { class: "row", style: "justify-content:center" }, h("button", { class: "btn red", onclick: () => openPaste(list) }, "Incolla lista"), h("button", { class: "btn line", onclick: () => openForm(list.id) }, "+ Regalo"))));
    if (!S.readOnly) parts.push(h("div", { class: "footer-tools" },
      h("button", { class: "btn sm", onclick: () => openRename(list) }, "Rinomina lista"),
      S.confirm === "dellist-" + list.id
        ? [h("button", { class: "btn red sm", onclick: () => { S.confirm = null; deleteList(list); } }, `Elimina la lista e i suoi ${all.length} regali`), h("button", { class: "btn sm", onclick: () => { S.confirm = null; render(); } }, "No")]
        : h("button", { class: "btn sm", onclick: () => { S.confirm = "dellist-" + list.id; render(); } }, "Elimina lista")));
    return parts;
  }
  function deleteList(list) {
    const ids = itemsOf(list.id).map((i) => i.id);
    S.active = ""; store.set("tab", "");
    write(async () => { for (const id of ids) await S.db.doc("items/" + id).delete(); await S.db.doc("lists/" + list.id).delete(); }, "Lista eliminata");
  }

  function renderMine() {
    const head = h("div", { class: "panel-head" }, h("div", {}, h("h2", {}, "I miei regali"), h("div", { class: "sub" }, "Tutto quello che hai prenotato, da tutte le liste.")));
    if (!S.me) return [head, h("div", { class: "empty" }, h("div", { class: "big" }, "🎅"), h("h3", {}, "Come ti chiami?"), h("p", {}, "Quando prenoti un regalo scrivi il tuo nome: qui ritrovi tutto quello che hai preso."), h("button", { class: "btn red", onclick: openName }, "Scrivi il tuo nome"))];
    const mine = S.items.filter((i) => i.claimedBy && isMe(i.claimedBy) && !ownList(listOf(i.listId)));
    if (!mine.length) return [head, h("div", { class: "empty" }, h("div", { class: "big" }, "🎁"), h("h3", {}, "Ancora nessun regalo"), h("p", {}, "Apri la lista di qualcuno, tocca un regalo e premi “Prenoto io”."))];
    const total = mine.reduce((s, i) => s + (Number(i.price) || 0), 0);
    return [head,
      h("div", { class: "summary" },
        h("div", {}, h("b", {}, mine.length), mine.length === 1 ? "regalo prenotato" : "regali prenotati"),
        h("div", {}, h("b", {}, `${mine.filter((i) => i.bought).length}/${mine.length}`), "già comprati"),
        total ? h("div", {}, h("b", {}, eur(total)), "spesa indicativa") : null),
      h("div", { class: "tags" }, mine.map((i) => tagEl(i, true)))];
  }

  function renderSetup() {
    const go = () => { S.family = newFamilyId(); store.set("family", S.family); location.hash = S.family; boot().then(() => setTimeout(openShare, 400)); };
    return h("div", { class: "empty" }, h("div", { class: "big" }, "🎄"),
      h("h3", {}, "Benvenuti!"),
      h("p", {}, "Creo un link segreto solo per la vostra famiglia. Poi lo mandi su WhatsApp: chi lo apre vede subito le liste, senza account."),
      h("button", { class: "btn red", onclick: go }, "Crea il nostro link"),
      h("p", { style: "margin:16px auto 0;font-size:13px" }, "Hai già ricevuto un link? Aprilo direttamente."));
  }

  function render() {
    renderLights(); renderCountdown(); renderWho();
    const main = $("#main");
    if (S.needsFamily) { put($("#tabs"), []); put(main, renderSetup()); return; }
    if (S.error) { put($("#tabs"), []); put(main, h("div", { class: "notice" }, S.error)); return; }
    if (!S.ready && !S.lists.length) {
      put($("#tabs"), []);
      put(main, h("div", { class: "empty" }, h("div", { class: "big" }, "🎄"), h("h3", {}, S.slow ? "Le liste non rispondono" : "Sto aprendo le liste…"),
        h("p", {}, S.slow ? "Controlla la connessione: appena torna, le liste compaiono da sole." : "Qui compaiono le liste dei regali di ogni persona.")));
      return;
    }
    if (S.active !== "mine" && !listOf(S.active)) S.active = S.lists[0]?.id || "mine";
    renderTabs();
    const parts = [];
    if (S.slow) parts.push(h("div", { class: "notice" }, "Collegamento lento: quello che vedi potrebbe non essere aggiornato."));
    if (S.readOnly) parts.push(h("div", { class: "notice" }, "Puoi guardare le liste ma non modificarle."));
    if (S.ready && !S.lists.length) parts.push(h("div", { class: "empty" }, h("div", { class: "big" }, "🎁"), h("h3", {}, "Nessuna lista ancora"), h("p", {}, "Crea la prima lista, per esempio quella della mamma."), S.readOnly ? null : h("button", { class: "btn red", onclick: openNewList }, "+ Nuova lista")));
    else if (S.active === "mine") parts.push(renderMine());
    else parts.push(renderList(listOf(S.active)));
    const y = window.scrollY;
    put(main, parts);
    window.scrollTo(0, y);
    refreshModal(false);
  }
  window.addEventListener("resize", renderLights);

  // ---------- snow ----------
  (function snow() {
    const c = $("#snow"); const ctx = c.getContext("2d"); if (!ctx) return;
    const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let W = 0, H = 0, flakes = [];
    const size = () => {
      const d = Math.min(window.devicePixelRatio || 1, 2); W = c.clientWidth; H = c.clientHeight; c.width = W * d; c.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
      const n = Math.round(Math.min(110, W * H / 12000));
      flakes = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 0.8 + Math.random() * 2.4, s: 0.3 + Math.random() * 0.9, w: Math.random() * 6.28 }));
      if (still) draw();
    };
    const draw = () => {
      ctx.clearRect(0, 0, W, H); ctx.fillStyle = "#ffffff";
      for (const f of flakes) { ctx.globalAlpha = 0.3 + f.r / 5; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill(); }
      ctx.globalAlpha = 1;
    };
    const tick = () => {
      for (const f of flakes) { f.y += f.s; f.w += 0.01; f.x += Math.sin(f.w) * 0.4; if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; } }
      draw(); requestAnimationFrame(tick);
    };
    size(); window.addEventListener("resize", size);
    if (!still) requestAnimationFrame(tick);
  })();

  render();
  boot();
})();
</script>
